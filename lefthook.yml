pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,json,css,md}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js}"
      run: bunx oxlint {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
